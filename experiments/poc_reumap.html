<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>POC: Client-Side Re-UMAP Benchmark</title>
<script src="https://cdn.jsdelivr.net/npm/umap-js@1.4.0/lib/umap-js.min.js"></script>
<script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; }
  h1 { text-align: center; padding: 12px 0 4px; font-size: 1.3rem; color: #fff; }
  .grid { display: grid; grid-template-columns: 280px 1fr 1fr; grid-template-rows: auto 1fr; gap: 8px; padding: 8px; height: calc(100vh - 60px); }
  .panel { background: #16213e; border-radius: 8px; padding: 12px; overflow: auto; }
  .controls { grid-row: 1 / 3; }
  .controls label { display: block; margin: 10px 0 4px; font-size: 0.85rem; color: #aaa; }
  .controls select, .controls button { width: 100%; padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; border: 1px solid #333; background: #0f3460; color: #e0e0e0; font-size: 0.9rem; }
  .controls button { cursor: pointer; background: #e94560; border: none; color: #fff; font-weight: bold; padding: 10px; margin-top: 8px; }
  .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
  .controls button:hover:not(:disabled) { background: #c73e54; }
  canvas { width: 100%; height: 100%; display: block; background: #0a0a1a; border-radius: 6px; }
  #deck-container { width: 100%; height: 100%; position: relative; border-radius: 6px; overflow: hidden; }
  .scatter-panel { position: relative; }
  .scatter-label { position: absolute; top: 8px; left: 12px; font-size: 0.75rem; color: #888; z-index: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 8px; }
  th, td { padding: 5px 6px; text-align: left; border-bottom: 1px solid #1a1a3e; }
  th { color: #e94560; font-size: 0.75rem; text-transform: uppercase; }
  td.pass { color: #4caf50; }
  td.stretch { color: #2196f3; }
  td.fail { color: #e94560; }
  .status { margin-top: 12px; font-size: 0.8rem; color: #888; min-height: 3em; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .checkbox-row input { accent-color: #e94560; }
  #timing-panel { grid-column: 2 / 4; }
  .seed-info { margin-top: 8px; padding: 8px; background: #0f3460; border-radius: 4px; font-size: 0.8rem; }
  .seed-info strong { color: #e94560; }
</style>
</head>
<body>
<h1>Client-Side Re-UMAP Benchmark</h1>
<div class="grid">
  <!-- Controls -->
  <div class="panel controls">
    <label>Subset Size</label>
    <select id="subset-size">
      <option value="500">500 nodes</option>
      <option value="1000" selected>1000 nodes</option>
      <option value="2000">2000 nodes</option>
    </select>

    <div class="checkbox-row">
      <input type="checkbox" id="warm-start" checked>
      <label for="warm-start" style="margin:0">Warm start</label>
    </div>

    <button id="btn-run-all">Run All Benchmarks</button>
    <button id="btn-run-selected" disabled>Re-UMAP Selected Subset</button>

    <div class="seed-info" id="seed-info">
      Click a point on the global scatter to select a seed repo.
    </div>

    <div class="status" id="status">Loading data...</div>

    <!-- Timing results table -->
    <h3 style="margin-top:16px;font-size:0.9rem;color:#fff">Benchmark Results</h3>
    <table id="timing-table">
      <thead>
        <tr><th>Benchmark</th><th>Time</th><th>Notes</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Global scatter -->
  <div class="panel scatter-panel">
    <span class="scatter-label">Global (10K) &mdash; click to select seed</span>
    <canvas id="global-canvas"></canvas>
  </div>

  <!-- Subset scatter -->
  <div class="panel scatter-panel">
    <span class="scatter-label">Subset (re-UMAP'd)</span>
    <canvas id="subset-canvas"></canvas>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let embeddings, knnIndices, knnDistances, coords, metadata;
const N = 10000, DIM = 512, K = 50;
let selectedSeed = null;
let subsetIndices = null;

// ── Data loading ─────────────────────────────────────────────────────────────
async function loadData() {
  const status = document.getElementById('status');
  const t0 = performance.now();

  const [embBuf, knnIdxBuf, knnDistBuf, coordsBuf, metaJson] = await Promise.all([
    fetch('../data/poc_embeddings.bin').then(r => r.arrayBuffer()),
    fetch('../data/poc_knn_indices.bin').then(r => r.arrayBuffer()),
    fetch('../data/poc_knn_distances.bin').then(r => r.arrayBuffer()),
    fetch('../data/poc_coords.bin').then(r => r.arrayBuffer()),
    fetch('../data/poc_metadata.json').then(r => r.json()),
  ]);

  embeddings = new Float32Array(embBuf);
  knnIndices = new Uint16Array(knnIdxBuf);
  knnDistances = new Float32Array(knnDistBuf);
  coords = new Float32Array(coordsBuf);
  metadata = metaJson;

  const loadTime = performance.now() - t0;
  status.textContent = `Data loaded in ${loadTime.toFixed(0)}ms`;
  addResult('Data load (all files)', loadTime, `${(embBuf.byteLength / 1e6).toFixed(1)}MB emb + metadata`);

  drawGlobalScatter();
}

// ── Cosine similarity ────────────────────────────────────────────────────────
function cosineSimilarities(seedIdx) {
  const seedOffset = seedIdx * DIM;
  const sims = new Float32Array(N);
  // Precompute seed norm
  let seedNorm = 0;
  for (let d = 0; d < DIM; d++) {
    seedNorm += embeddings[seedOffset + d] * embeddings[seedOffset + d];
  }
  seedNorm = Math.sqrt(seedNorm);

  for (let i = 0; i < N; i++) {
    const iOffset = i * DIM;
    let dot = 0, norm = 0;
    for (let d = 0; d < DIM; d++) {
      dot += embeddings[seedOffset + d] * embeddings[iOffset + d];
      norm += embeddings[iOffset + d] * embeddings[iOffset + d];
    }
    sims[i] = dot / (seedNorm * Math.sqrt(norm) + 1e-10);
  }
  return sims;
}

function topKIndices(sims, k) {
  const indexed = Array.from(sims, (v, i) => [v, i]);
  indexed.sort((a, b) => b[0] - a[0]);
  return indexed.slice(0, k).map(x => x[1]);
}

// ── KNN subset remapping ─────────────────────────────────────────────────────
function remapKnnToSubset(globalSubsetIndices) {
  const nSubset = globalSubsetIndices.length;
  const globalToLocal = new Int32Array(N).fill(-1);
  for (let i = 0; i < nSubset; i++) {
    globalToLocal[globalSubsetIndices[i]] = i;
  }

  // Count average in-subset neighbors
  let totalInSubset = 0;
  const remappedIdx = [];
  const remappedDist = [];

  for (let i = 0; i < nSubset; i++) {
    const gi = globalSubsetIndices[i];
    const rowIdx = [];
    const rowDist = [];
    for (let j = 0; j < K; j++) {
      const neighbor = knnIndices[gi * K + j];
      const local = globalToLocal[neighbor];
      if (local >= 0) {
        rowIdx.push(local);
        rowDist.push(knnDistances[gi * K + j]);
      }
    }
    totalInSubset += rowIdx.length;
    remappedIdx.push(rowIdx);
    remappedDist.push(rowDist);
  }

  const avgNeighbors = totalInSubset / nSubset;
  return { remappedIdx, remappedDist, avgNeighbors };
}

// ── Canvas scatter drawing ───────────────────────────────────────────────────
function drawScatter(canvasId, pts, options = {}) {
  const canvas = document.getElementById(canvasId);
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = (rect.width - 24) * dpr;
  canvas.height = (rect.height - 34) * dpr;
  canvas.style.width = (rect.width - 24) + 'px';
  canvas.style.height = (rect.height - 34) + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const w = rect.width - 24;
  const h = rect.height - 34;

  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, w, h);

  if (pts.length === 0) return;

  // Compute bounds
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of pts) {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }
  const margin = 20;
  const scaleX = (w - 2 * margin) / (maxX - minX || 1);
  const scaleY = (h - 2 * margin) / (maxY - minY || 1);
  const scale = Math.min(scaleX, scaleY);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;

  const toScreen = (x, y) => [
    w / 2 + (x - cx) * scale,
    h / 2 + (y - cy) * scale,
  ];

  // Draw base points
  ctx.globalAlpha = options.highlightSet ? 0.15 : 0.6;
  ctx.fillStyle = '#4a90d9';
  for (const p of pts) {
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.fillRect(sx - 1, sy - 1, 2, 2);
  }

  // Draw highlighted subset
  if (options.highlightSet) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = '#e94560';
    for (const idx of options.highlightSet) {
      const p = pts[idx];
      const [sx, sy] = toScreen(p.x, p.y);
      ctx.beginPath();
      ctx.arc(sx, sy, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw seed
  if (options.seedIdx != null) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ffeb3b';
    const p = pts[options.seedIdx];
    const [sx, sy] = toScreen(p.x, p.y);
    ctx.beginPath();
    ctx.arc(sx, sy, 5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;

  // Store transform for hit-testing
  canvas._scatterTransform = { cx, cy, scale, w, h, pts };
}

function drawGlobalScatter(highlightSet = null, seedIdx = null) {
  if (!coords) return;
  const pts = [];
  for (let i = 0; i < N; i++) {
    pts.push({ x: coords[i * 2], y: coords[i * 2 + 1] });
  }
  drawScatter('global-canvas', pts, { highlightSet, seedIdx });
}

function drawSubsetScatter(subsetCoords) {
  const pts = [];
  for (let i = 0; i < subsetCoords.length / 2; i++) {
    pts.push({ x: subsetCoords[i * 2], y: subsetCoords[i * 2 + 1] });
  }
  drawScatter('subset-canvas', pts);
}

// ── Click to select seed ─────────────────────────────────────────────────────
document.getElementById('global-canvas').addEventListener('click', (e) => {
  const canvas = e.target;
  const transform = canvas._scatterTransform;
  if (!transform) return;

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // Find nearest point
  let bestDist = Infinity, bestIdx = -1;
  for (let i = 0; i < transform.pts.length; i++) {
    const p = transform.pts[i];
    const sx = transform.w / 2 + (p.x - transform.cx) * transform.scale;
    const sy = transform.h / 2 + (p.y - transform.cy) * transform.scale;
    const d = (sx - mx) ** 2 + (sy - my) ** 2;
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }

  if (bestIdx >= 0 && bestDist < 400) {
    selectSeed(bestIdx);
  }
});

function selectSeed(idx) {
  selectedSeed = idx;
  const subsetSize = parseInt(document.getElementById('subset-size').value);
  const sims = cosineSimilarities(idx);
  subsetIndices = topKIndices(sims, subsetSize);

  const info = document.getElementById('seed-info');
  const m = metadata[idx];
  info.innerHTML = `<strong>${m.name}</strong><br>${(m.stars/1000).toFixed(1)}k stars &middot; ${m.language || 'N/A'}`;

  document.getElementById('btn-run-selected').disabled = false;
  drawGlobalScatter(new Set(subsetIndices), idx);
}

// ── UMAP runner ──────────────────────────────────────────────────────────────
async function runUmap(subsetEmbeddings, nSubset, usePrecomputed, warmStartCoords) {
  const UMAP = window.UMAP;

  const opts = {
    nNeighbors: 15,
    minDist: 0.05,
    nComponents: 2,
    spread: 1.0,
  };

  const UMAPClass = window.UMAP.UMAP || window.UMAP;
  const umap = new UMAPClass(opts);

  // Reshape embeddings to 2D array for umap-js
  const data = [];
  for (let i = 0; i < nSubset; i++) {
    data.push(Array.from(subsetEmbeddings.subarray(i * DIM, (i + 1) * DIM)));
  }

  // Initialize fit
  umap.initializeFit(data);

  // Warm start: try to set embedding to rescaled original coords
  if (warmStartCoords) {
    try {
      if (umap.embedding && Array.isArray(umap.embedding)) {
        for (let i = 0; i < nSubset; i++) {
          umap.embedding[i][0] = warmStartCoords[i * 2];
          umap.embedding[i][1] = warmStartCoords[i * 2 + 1];
        }
      } else {
        console.warn('umap.embedding not accessible for warm start, falling back to random init');
      }
    } catch (e) {
      console.warn('Warm start failed:', e.message);
    }
  }

  // Run epochs
  const nEpochs = umap.getNEpochs();
  for (let i = 0; i < nEpochs; i++) {
    umap.step();
    // Yield to UI every 50 epochs
    if (i % 50 === 0) {
      await new Promise(r => setTimeout(r, 0));
    }
  }

  // Extract result
  const result = new Float32Array(nSubset * 2);
  const embedding = umap.getEmbedding();
  for (let i = 0; i < nSubset; i++) {
    result[i * 2] = embedding[i][0];
    result[i * 2 + 1] = embedding[i][1];
  }
  return result;
}

// ── Benchmarks ───────────────────────────────────────────────────────────────
const timingBody = document.querySelector('#timing-table tbody');

function addResult(name, timeMs, notes = '') {
  const row = document.createElement('tr');
  row.innerHTML = `<td>${name}</td><td>${timeMs.toFixed(0)}ms</td><td>${notes}</td>`;
  timingBody.appendChild(row);
}

function clearResults() {
  timingBody.innerHTML = '';
}

function getSubsetEmbeddings(indices) {
  const n = indices.length;
  const result = new Float32Array(n * DIM);
  for (let i = 0; i < n; i++) {
    const gi = indices[i];
    for (let d = 0; d < DIM; d++) {
      result[i * DIM + d] = embeddings[gi * DIM + d];
    }
  }
  return result;
}

function getSubsetCoords(indices) {
  const n = indices.length;
  const result = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) {
    const gi = indices[i];
    result[i * 2] = coords[gi * 2];
    result[i * 2 + 1] = coords[gi * 2 + 1];
  }
  return result;
}

function rescaleCoords(coordsArr, nPts) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < nPts; i++) {
    const x = coordsArr[i * 2], y = coordsArr[i * 2 + 1];
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const span = Math.max(maxX - minX, maxY - minY);
  const scale = 18.0 / (span || 1); // maps to [-9, 9]
  const result = new Float32Array(nPts * 2);
  for (let i = 0; i < nPts; i++) {
    result[i * 2] = (coordsArr[i * 2] - cx) * scale;
    result[i * 2 + 1] = (coordsArr[i * 2 + 1] - cy) * scale;
  }
  return result;
}

async function runAllBenchmarks() {
  const btn = document.getElementById('btn-run-all');
  const status = document.getElementById('status');
  btn.disabled = true;
  clearResults();

  // Use a random seed if none selected
  if (selectedSeed == null) {
    selectSeed(Math.floor(Math.random() * N));
  }

  const sizes = [500, 1000, 2000];

  // Benchmark 1: Cosine similarity
  status.textContent = 'Running cosine similarity benchmark...';
  await new Promise(r => setTimeout(r, 10));
  {
    const t0 = performance.now();
    const sims = cosineSimilarities(selectedSeed);
    const t1 = performance.now();
    addResult('Cosine sim (1 vs 10K, 512D)', t1 - t0);
  }

  for (const size of sizes) {
    // Get subset
    const sims = cosineSimilarities(selectedSeed);
    const subset = topKIndices(sims, size);
    const subEmb = getSubsetEmbeddings(subset);
    const subCoords = getSubsetCoords(subset);
    const remap = remapKnnToSubset(subset);

    // Benchmark 2: UMAP with precomputed KNN, random init
    status.textContent = `UMAP ${size} nodes (precomputed KNN, random init)...`;
    await new Promise(r => setTimeout(r, 10));
    {
      const t0 = performance.now();
      const result = await runUmap(subEmb, size, true, null);
      const t1 = performance.now();
      addResult(`UMAP ${size} (precomp KNN, random)`, t1 - t0, `avg ${remap.avgNeighbors.toFixed(1)} in-subset neighbors`);
    }

    // Benchmark 3: UMAP with precomputed KNN, warm start
    status.textContent = `UMAP ${size} nodes (precomputed KNN, warm start)...`;
    await new Promise(r => setTimeout(r, 10));
    {
      const warmCoords = rescaleCoords(subCoords, size);
      const t0 = performance.now();
      const result = await runUmap(subEmb, size, true, warmCoords);
      const t1 = performance.now();
      addResult(`UMAP ${size} (precomp KNN, warm)`, t1 - t0);
      if (size === parseInt(document.getElementById('subset-size').value)) {
        drawSubsetScatter(result);
      }
    }

    // Benchmark 4: UMAP without precomputed KNN (skip 2000 — too slow)
    if (size <= 1000) {
      status.textContent = `UMAP ${size} nodes (no precomputed KNN)...`;
      await new Promise(r => setTimeout(r, 10));
      {
        const t0 = performance.now();
        const result = await runUmap(subEmb, size, false, null);
        const t1 = performance.now();
        addResult(`UMAP ${size} (no precomp KNN)`, t1 - t0);
      }
    }
  }

  // Benchmark 5: deck.gl ScatterplotLayer update
  status.textContent = 'Benchmarking deck.gl position update...';
  await new Promise(r => setTimeout(r, 10));
  {
    const deckData = [];
    for (let i = 0; i < 2000; i++) {
      deckData.push({ position: [Math.random() * 100, Math.random() * 100], color: [233, 69, 96] });
    }
    const t0 = performance.now();
    // Just measure data prep + layer construction time
    const layer = new deck.ScatterplotLayer({
      id: 'bench-scatter',
      data: deckData,
      getPosition: d => d.position,
      getFillColor: d => d.color,
      getRadius: 3,
      radiusMinPixels: 2,
    });
    const t1 = performance.now();
    addResult('deck.gl ScatterplotLayer create (2K)', t1 - t0);
  }

  status.textContent = 'All benchmarks complete.';
  btn.disabled = false;
}

// ── Re-UMAP selected subset ─────────────────────────────────────────────────
async function runSelectedSubset() {
  if (selectedSeed == null || subsetIndices == null) return;
  const btn = document.getElementById('btn-run-selected');
  const status = document.getElementById('status');
  btn.disabled = true;

  const size = subsetIndices.length;
  const subEmb = getSubsetEmbeddings(subsetIndices);
  const subCoords = getSubsetCoords(subsetIndices);
  const warmStart = document.getElementById('warm-start').checked;
  const warmCoords = warmStart ? rescaleCoords(subCoords, size) : null;

  status.textContent = `Running UMAP on ${size} nodes...`;
  await new Promise(r => setTimeout(r, 10));

  const t0 = performance.now();
  const result = await runUmap(subEmb, size, true, warmCoords);
  const t1 = performance.now();

  addResult(`Re-UMAP ${size} (${warmStart ? 'warm' : 'random'})`, t1 - t0);
  drawSubsetScatter(result);

  status.textContent = `Re-UMAP complete: ${(t1 - t0).toFixed(0)}ms`;
  btn.disabled = false;
}

// ── Event listeners ──────────────────────────────────────────────────────────
document.getElementById('btn-run-all').addEventListener('click', runAllBenchmarks);
document.getElementById('btn-run-selected').addEventListener('click', runSelectedSubset);
document.getElementById('subset-size').addEventListener('change', () => {
  if (selectedSeed != null) selectSeed(selectedSeed);
});

// ── Init ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  drawGlobalScatter(
    subsetIndices ? new Set(subsetIndices) : null,
    selectedSeed
  );
});

loadData().catch(e => {
  document.getElementById('status').textContent = `Error loading data: ${e.message}. Run 'make poc-reumap' first.`;
  console.error(e);
});
</script>
</body>
</html>
